<div class="page">

<div class="form-card">

    <div class="header">
        <span class="eyebrow">GERENCIAMENTO DE TIMES</span>

        <h1>Cadastro de Time</h1>

        <p>
            Adicione um novo time à competição ou atualize seus dados.
        </p>
    </div>

    <div class="form">

        <div class="form-group full">
            <label for="nome">Nome do time</label>
            <input
                id="nome"
                type="text"
                [(ngModel)]="time.nome"
                placeholder="Digite o nome do time">
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="sigla">Sigla</label>
                <input
                    id="sigla"
                    type="text"
                    [(ngModel)]="time.sigla"
                    placeholder="Ex.: BRA">
            </div>

            <div class="form-group">
                <label for="ranking">Ranking FIFA</label>
                <input
                    id="ranking"
                    type="number"
                    [(ngModel)]="time.ranking_fifa"
                    placeholder="Ex.: 1">
            </div>

        </div>

        <div class="form-group full">
            <label for="copas">Número de Copas</label>
            <input
                id="copas"
                type="number"
                [(ngModel)]="time.qtd_copas"
                placeholder="Ex.: 5">
        </div>

        <div class="form-group checkbox">

            <label>
                <input
                    type="checkbox"
                    [(ngModel)]="time.ativo">

                <span>Time ativo</span>
            </label>

        </div>

        <div class="form-group full">
            <label for="data">Data de Fundação</label>
            <input
                id="data"
                type="date"
                [(ngModel)]="time.data_fundacao">
        </div>

        <button
            type="button"
            (click)="salvar()">
            Salvar Time
        </button>

    </div>

</div>
</div>
