<div class="page">

    <div class="form-card">

        <div class="header">

            <span class="eyebrow">GERENCIAMENTO DE JOGOS</span>

            <h1>Cadastro de Jogo</h1>

            <p>
                Adicione os dados de uma partida à competição.
            </p>

        </div>

        <div class="form">

            <div class="form-row">

                <div class="form-group">
                    <label for="mandante">ID Time Mandante</label>

                    <input id="mandante" type="number" [(ngModel)]="jogo.id_time_mandante" placeholder="Ex.: 1">
                </div>

                <div class="form-group">
                    <label for="visitante">ID Time Visitante</label>

                    <input id="visitante" type="number" [(ngModel)]="jogo.id_time_visitante" placeholder="Ex.: 2">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="gols-mandante">Gols Mandante</label>

                    <input id="gols-mandante" type="number" [(ngModel)]="jogo.nr_gols_mandante" placeholder="Ex.: 2">
                </div>

                <div class="form-group">
                    <label for="gols-visitante">Gols Visitante</label>

                    <input id="gols-visitante" type="number" [(ngModel)]="jogo.nr_gols_visitante" placeholder="Ex.: 1">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="publico">Público Pagante</label>

                    <input id="publico" type="number" [(ngModel)]="jogo.publico_pagante" placeholder="Ex.: 50000">
                </div>

                <div class="form-group">
                    <label for="renda">Renda Total</label>

                    <input id="renda" type="number" [(ngModel)]="jogo.renda_total" placeholder="Ex.: 2500000">
                </div>

            </div>

            <div class="form-group checkbox">

                <label>
                    <input type="checkbox" [(ngModel)]="jogo.realizada">

                    <span>Jogo realizado</span>
                </label>

            </div>

            <div class="form-group">

                <label for="data">Data do Jogo</label>

                <input id="data" type="date" [(ngModel)]="jogo.data_jogo">

            </div>

            <button type="button" (click)="salvar()">
                Salvar Jogo
            </button>

        </div>

    </div>

</div>
